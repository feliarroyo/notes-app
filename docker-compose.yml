services:
  # Database Container
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: compose_user
      POSTGRES_PASSWORD: compose_password
    ports:
      - "5432:5432"

  # Backend Container
  backend:
    build:
      context: ./backend/notes
    ports:
      - "8080:8080"
    environment:
      # Override application.properties for Docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/notes_db
      - SPRING_DATASOURCE_USERNAME=compose_user
      - SPRING_DATASOURCE_PASSWORD=compose_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db

  # Frontend Container
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend